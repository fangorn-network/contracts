name: solidity

on:
  pull_request:
    paths: ["**", ".github/workflows/solidity.yml"]
  push:
    branches: [main]
    paths: ["**", ".github/workflows/solidity.yml"]

# The job runs pull request code with ffi on, and fetches the upgrade validator from npm.
permissions:
  contents: read

defaults:
  run:
    working-directory: .

jobs:
  forge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1

      - run: forge build --sizes

      - run: forge test -vvv

      - name: Coverage (>= 85% lines in src/)
        run: |
          # UpgradeSafety is left out: the plugin cannot validate a coverage build.
          forge coverage --report summary --no-match-coverage "(test|script)/" --no-match-contract UpgradeSafety | tee coverage.txt
          pct=$(grep -E '^\| Total' coverage.txt | grep -oE '[0-9]+\.[0-9]+%' | head -1 | tr -d %)
          echo "Line coverage: ${pct}%"
          awk -v p="$pct" 'BEGIN { exit !(p >= 85) }' || { echo "::error::Line coverage ${pct}% is below 85%"; exit 1; }

  # On merge to main: upgrade every proxy whose code in src/ differs from the live code,
  # then open a PR with the new builds under deployed/ and the broadcast log (main only takes PRs).
  # Merge it before the next upgrade: until deployed/ holds the live build, Upgrade.s.sol refuses to run.
  # Upgrade.s.sol decides what is out of date, so a merge that changes no contract sends nothing.
  upgrade:
    needs: forge
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Add required reviewers to this environment (Settings → Environments) to approve each upgrade by hand.
    environment: base-sepolia
    concurrency: { group: upgrade-base-sepolia, cancel-in-progress: false }
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1

      - name: Upgrade
        env:
          RPC_URL: ${{ vars.BASE_SEPOLIA_RPC_URL }}
          ADMIN_PRIVATE_KEY: ${{ secrets.ADMIN_PRIVATE_KEY }}
        run: forge script script/Upgrade.s.sol --force --rpc-url "$RPC_URL" --private-key "$ADMIN_PRIVATE_KEY" --broadcast

      - name: Open PR with builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add deployed broadcast
          git diff --cached --quiet && { echo "Nothing upgraded."; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          branch="upgrade-builds/${GITHUB_SHA::7}"
          git switch -c "$branch"
          git commit -m "Record upgrade builds for ${GITHUB_SHA::7}"
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title "Record upgrade builds for ${GITHUB_SHA::7}" \
            --body "The upgrade from ${GITHUB_SHA} is already live on base-sepolia. Merge this before the next upgrade."
