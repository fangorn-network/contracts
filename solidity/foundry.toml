[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc = "0.8.30"
optimizer = true
optimizer_runs = 200
# Nothing here needs a newer fork, and "paris" bytecode runs on every Arbitrum
# chain regardless of which ArbOS version it is on.
evm_version = "paris"

[lint]
# Argument and event-field names are snake_case on purpose: they mirror the Stylus
# contracts' ABI, and the SDK reads event fields by those names.
exclude_lints = ["mixed-case-variable", "unwrapped-modifier-logic", "asm-keccak256"]
