[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc = "0.8.30"
optimizer = true
optimizer_runs = 200
# "cancun": OpenZeppelin 5.7's ERC721 / EIP712 use mcopy. Arbitrum has run Cancun
# since ArbOS 20 (2024), on Sepolia and One alike.
evm_version = "cancun"
# layout.sh reads each contract's storage layout from the build artifacts.
extra_output = ["storageLayout"]

[lint]
# Argument and event-field names are snake_case on purpose: they mirror the Stylus
# contracts' ABI, and the SDK reads event fields by those names.
# block-timestamp: comparisons are membership expiries and permit deadlines (days),
# so the few seconds of validator skew don't matter.
exclude_lints = ["mixed-case-variable", "unwrapped-modifier-logic", "asm-keccak256", "block-timestamp"]
